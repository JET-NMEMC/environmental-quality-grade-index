<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>环境质量等级指数 (EQGI)</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        table {
            border-collapse: collapse;
            margin: 20px 0;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }

        .result-row {
            background-color: #e6f7ff;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>
    <h1>环境质量等级指数 (EQGI)：海水水质标准（GB 3097-1997）</h1>
    <button onclick="downloadSample()" title="Click here to download the sample data file.">下载示例数据</button>

    <input type="file" id="fileInput" accept=".xlsx, .xls, .csv" onchange="processFile()"
        title="Please select an CSV file to upload." />

    <div id="resultContainer"></div>
    <button id="export-excel" style="display: none;">下载评价结果 (Excel)</button>
    <!-- // 引入海水水质标准 -->
    <script src="seawaterQualityStandards.js"></script>

    <script>
        const downloadSample = () => {
            const a = document.createElement('a');
            a.href = '测试数据.csv'; a.download = '测试数据.csv'; a.click();
        };

        // 数据清洗与转数字
        function parseVal(val) {
            if (val === undefined || val === null) return undefined;
            const s = String(val).replace(/\s+/g, '').toUpperCase();
            if (s === '' || s === '/') return undefined;
            if (s === '未检出' || s === 'ND') return 0;
            const numStr = s.endsWith('L') ? s.slice(0, -1) : s;
            if (!/^\d*\.?\d+$/.test(numStr)) return `非法(${val})`;
            const n = parseFloat(numStr);
            return n >= 0 ? n : `非法(${val})`;
        }

        // 核心指数计算逻辑
        function calcIdx(v, std, dof) {
            if (v === undefined || v === '') return '';
            if (typeof v === 'string') return v;
            const { type, values: vs } = std;
            if (type === '≤') {
                if (v <= vs[0]) return v / vs[0];
                if (v <= vs[1]) return 1 + (v - vs[0]) / (vs[1] - vs[0]);
                if (v <= vs[2]) return 2 + (v - vs[1]) / (vs[2] - vs[1]);
                return vs[3] === null ? 3 + (v - vs[2]) / vs[2] : (v <= vs[3] ? 3 + (v - vs[2]) / (vs[3] - vs[2]) : 4 + (v - vs[3]) / vs[3]);
            }
            if (type === '>') {
                if (v >= dof) return 0;
                if (v >= vs[0]) return (dof - v) / (dof - vs[0]);
                if (v >= vs[1]) return 1 + (vs[0] - v) / (vs[0] - vs[1]);
                if (v >= vs[2]) return 2 + (vs[1] - v) / (vs[1] - vs[2]);
                return v >= vs[3] ? 3 + (vs[2] - v) / (vs[2] - vs[3]) : 4 + (vs[3] - v) / vs[3];
            }
            if (type === '<>') {
                const [v1l, v1h] = vs[0], [v3l, v3h] = vs[2], p0 = (v1l + v1h) / 2;
                if (v >= v1l && v <= v1h) return Math.abs(v - p0) / (v1h - p0);
                if (v >= v3l && v < v1l) return 2 + (v1l - v) / (v1l - v3l);
                if (v > v1h && v <= v3h) return 2 + (v - v1h) / (v3h - v1h);
                return v < v3l ? 4 + (v3l - v) : 4 + (v - v3h) / 0.3;
            }
            return '未知';
        }

        // 查找标准及键名
        const findStd = (name) => {
            for (const k in seawaterQualityStandards.items) {
                if (seawaterQualityStandards.items[k].names.some(n => n.toLowerCase() === name.trim().toLowerCase()))
                    return { std: seawaterQualityStandards.items[k], key: k };
            }
            return null;
        };

        async function processFile() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) return;
            const data = new Uint8Array(await file.arrayBuffer());
            const workbook = XLSX.read(data, { type: 'array' });
            const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 });

            const headers = json[0].slice(1), units = (json[1] || []).slice(1);
            const colInfos = headers.map((h, i) => ({ header: h, unit: String(units[i] || '').trim(), ...findStd(h) }));
            const tempColIdx = colInfos.findIndex(c => c.key === '温度');

            const results = json.slice(2).filter(row => row.length).map(row => {
                const site = { name: row[0], res: {}, agg: {} };
                const tempVal = tempColIdx >= 0 ? parseVal(row[tempColIdx + 1]) : NaN;

                colInfos.forEach((info, i) => {
                    if (info.std && info.std.type === 'none') return; // 使用 type: 'none' 识别跳过项
                    if (!info.std) {
                        site.res[info.header] = '无标准';
                        return;
                    }
                    let v = parseVal(row[i + 1]);
                    if (typeof v === 'number' && info.std.unit && info.unit) {
                        const u = info.unit, su = info.std.unit.trim();
                        if (u === 'μg/L' && su === 'mg/L') v /= 1000;
                        else if (u === 'mg/L' && su === 'μg/L') v *= 1000;
                    }
                    const dof = info.key === '溶解氧' ? 468 / (31.6 + tempVal) : null;
                    site.res[info.header] = (info.key === '溶解氧' && isNaN(tempVal)) ? '缺少温度' : calcIdx(v, info.std, dof);
                });

                const valid = Object.values(site.res).filter(v => typeof v === 'number');
                if (valid.length) {
                    site.agg.max = Math.max(...valid);
                    site.agg.mean = valid.reduce((a, b) => a + b, 0) / valid.length;
                    const s = [...valid].sort((a, b) => a - b), m = Math.floor(s.length / 2);
                    site.agg.med = s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
                }
                return site;
            });

            render(results, colInfos.filter(c => !c.std || c.std.type !== 'none').map(c => c.header));
        }

        function render(results, displayCols) {
            const container = document.getElementById('resultContainer');
            if (!results.length) return container.innerHTML = '<p>未找到有效数据</p>';

            const format = v => typeof v === 'number' ? v.toFixed(3) : (v || '');
            const isErr = v => typeof v === 'string' && ['非法', '项目错误', '缺少温度', '未知', '无标准'].some(k => v.includes(k));

            container.innerHTML = `
                <table>
                    <tr>
                        <th>站点</th>
                        ${displayCols.map(c => `<th>${c}</th>`).join('')}
                        <th style="background:#d4edda">最大值</th>
                        <th style="background:#d4edda">平均值</th>
                        <th style="background:#d4edda">中位值</th>
                    </tr>
                    ${results.map(r => `
                        <tr class="result-row">
                            <td>${r.name}</td>
                            ${displayCols.map(c => `<td class="${isErr(r.res[c]) ? 'error' : ''}">${format(r.res[c])}</td>`).join('')}
                            <td style="font-weight:bold">${format(r.agg.max)}</td>
                            <td style="font-weight:bold">${format(r.agg.mean)}</td>
                            <td style="font-weight:bold">${format(r.agg.med)}</td>
                        </tr>
                    `).join('')}
                </table>`;
            document.getElementById('export-excel').style.display = 'block';
        }

        document.getElementById('export-excel').onclick = () => {
            const wb = XLSX.utils.book_new(), ws = XLSX.utils.table_to_sheet(document.querySelector('table'));
            XLSX.utils.book_append_sheet(wb, ws, "评价结果");
            XLSX.writeFile(wb, "海水水质评价结果.xlsx");
        };
    </script>
</body>

</html>
