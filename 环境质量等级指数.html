<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>环境质量等级指数</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        table {
            border-collapse: collapse;
            margin: 20px 0;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }

        .result-row {
            background-color: #e6f7ff;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>
    <h1>环境质量等级指数：海水水质标准（GB 3097-1997）</h1>

    <button onclick="downloadSample()">下载示例数据</button>
    <input type="file" id="fileInput" accept=".xlsx, .xls, .csv" onchange="processFile()" />

    <div id="resultContainer"></div>
    <!-- // 引入海水水质标准 -->
    <script src="seawaterQualityStandards.js"></script>

    <script>
        function downloadSample() {
            const link = document.createElement('a');
            link.href = '测试数据.csv';
            link.download = '测试数据.csv';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function isNumber(val) {
            // var strVal = String(val).trim(); //移除空格（首尾）
            var str = String(val).replace(/\s+/g, '');// 移除空格（包括中间、首尾）
            if (str === '') return false; // 空字符串，直接返回
            const reg = /^[-+]?\d*\.?\d+$/;
            const illegalEdge = ['-', '+', '.', '-.', '+.']
            return reg.test(str) && !illegalEdge.includes(str);
        }

        function smartToNonNegativeNumberOrOriginal(val, pollutantName, rowname) {

            // 步骤1：统一预处理：转字符串 + 删除所有空格（首尾+中间）
            const strVal = String(val).replace(/\s+/g, '');

            // 删除空格后为空字符串或/→ 返回undefined
            if (strVal === '' || strVal === '/') {
                return undefined;
            }

            // 步骤2：定义「合法非负数字」的校验函数（移除正负号匹配，仅支持非负数）
            const isLegalNonNegativeNumber = (str) => {
                if (str === '') return false; // 空字符串提前排除（冗余但保留，防止逻辑变更）
                const reg = /^\d*\.?\d*$/; // 仅支持 123、123.、.456、123.456 等非负格式
                const illegalEdge = ['+', '.', '+.',];
                return reg.test(str) && !illegalEdge.includes(str);
            };

            // 优先级1：业务特殊值（未检出）→ 返回0（最高优先级）
            if (strVal === '未检出' || strVal === 'ND') {
                return 0;
            }

            // 合并处理：先统一处理末尾L（有则删，无则保留），再校验数字
            let processedStr = strVal;
            const lastChar = strVal.slice(-1);
            // 如果最后一个字符是L，删除L得到处理后的字符串
            if (lastChar === 'L') {
                processedStr = strVal.slice(0, -1);
            }

            // 统一校验：处理后的字符串是合法非负数字 → 转数字返回
            if (isLegalNonNegativeNumber(processedStr)) {
                return parseFloat(processedStr);
            }

            // 优先级4：其他情况 → 返回"非法字符"
            console.log(`警告!!!发现未识别字符串或负数:项目[${pollutantName}]   行号[${rowname}]    值[${val}]`);
            return '非法(' + val + ')';
        }


        // 水质指数计算函数（增加dof参数）
        function calculateIndex(value, standard, dof) {
            const { type, values } = standard;

            // 处理未定义和空值（数据缺失）
            if (value === undefined) {
                return '';
            }
            // 处理非数字值（数据错误）
            if (value && String(value).includes('非法')) {
                return value;
            }

            switch (type) {
                case '≤':  // 污染物浓度越高水质越差
                    if (value <= values[0]) {
                        return value / values[0]; // 0~1类之间
                    } else if (value <= values[1]) {
                        return 1 + (value - values[0]) / (values[1] - values[0]); // 1~2类
                    } else if (value <= values[2]) {
                        return 2 + (value - values[1]) / (values[2] - values[1]); // 2~3类
                    } else if (values[3] === null) {
                        // 4类标准为null时，超出3类，超标倍数法。特例,针对:'大肠菌群'和'粪大肠杆菌群'
                        return 3 + (value - values[2]) / values[2];
                    } else {
                        // 4类标准不为null时
                        if (value <= values[3]) {
                            return 3 + (value - values[2]) / (values[3] - values[2]); // 3~4类
                        } else {
                            return 4 + (value - values[3]) / values[3]; // 超出4类，超标倍数法
                        }
                    }

                case '>':  // 污染物浓度越高水质越好（溶解氧）
                    // 使用传入的dof值（饱和溶解氧）
                    if (value >= dof) return 0; // 0类
                    else if (value >= values[0]) return (dof - value) / (dof - values[0]); // 0~1类
                    else if (value >= values[1]) return 1 + (values[0] - value) / (values[0] - values[1]); // 1~2类
                    else if (value >= values[2]) return 2 + (values[1] - value) / (values[1] - values[2]); // 2~3类
                    else if (value >= values[3]) return 3 + (values[2] - value) / (values[2] - values[3]); // 3~4类
                    else return 4 + (values[3] - value) / values[3]; // 超出4类

                case '<>':  // 有最佳范围（pH）
                    const class1Range = values[0]; // [7.8, 8.5]
                    const class3Range = values[2]; // [6.8, 8.8]
                    const pH0 = (class1Range[0] + class1Range[1]) / 2; // 最佳值（1类范围的中点）

                    if (value >= class1Range[0] && value <= class1Range[1]) {
                        return Math.abs(value - pH0) / (class1Range[1] - pH0); // 1类范围内
                    }
                    else if (value >= class3Range[0] && value < class1Range[0]) {
                        return 2 + (class1Range[0] - value) / (class1Range[0] - class3Range[0]); // 左侧3类范围
                    }
                    else if (value > class1Range[1] && value <= class3Range[1]) {
                        return 2 + (value - class1Range[1]) / (class3Range[1] - class1Range[1]); // 右侧3类范围
                    }
                    else if (value < class3Range[0]) {
                        return 4 + (class3Range[0] - value) / 1; // 低于3类下限
                    }
                    else if (value > class3Range[1]) {
                        return 4 + (value - class3Range[1]) / 0.3; // 高于3类上限
                    }
                    return 0;

                default:
                    return '未知类型';
            }
        }

        // 处理上传的Excel文件
        function processFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            if (!file) {
                alert('请选择Excel文件');
                return;
            }

            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];

                    // 将Excel数据转换为JSON
                    const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                    // 解析Excel结构
                    const pollutants = jsonData[0].slice(1); // 污染物名称（第一行）
                    const csvUnits = jsonData[1] ? jsonData[1].slice(1) : []; // 单位（第二行）
                    const sites = [];

                    // 从第三行开始处理站点数据
                    for (let i = 2; i < jsonData.length; i++) {
                        const row = jsonData[i];
                        if (!row || row.length === 0) continue;

                        const site = {
                            name: row[0],
                            values: {}
                        };

                        // 处理每个污染物值
                        for (let j = 1; j < row.length; j++) {
                            const pollutantName = pollutants[j - 1];
                            const csvUnit = csvUnits[j - 1] ? String(csvUnits[j - 1]).trim() : null;
                            var processedValue = row[j];
                            // 处理负值或无效值
                            if (typeof processedValue === 'string' || processedValue < 0) {
                                processedValue = smartToNonNegativeNumberOrOriginal(processedValue, pollutantName, row[0]);
                            }

                            // 基于单位进行数字转换
                            if (typeof processedValue === 'number') {
                                const standard = findStandard(pollutantName);
                                if (standard && standard.unit && csvUnit) {
                                    const standardUnit = standard.unit.trim();
                                    if (csvUnit !== standardUnit) {
                                        if (csvUnit === 'μg/L' && standardUnit === 'mg/L') {
                                            processedValue = processedValue / 1000;
                                        } else if (csvUnit === 'mg/L' && standardUnit === 'μg/L') {
                                            processedValue = processedValue * 1000;
                                        }
                                        // 可以根据需要添加更多转换逻辑
                                    }
                                }
                            }

                            site.values[pollutantName] = processedValue;
                        }

                        sites.push(site);
                    }
                    console.log('项目列表:', pollutants);
                    console.log('清洗数据:', sites);


                    // 1. 计算所有站点的水质指数
                    const results = calculateAllSitesIndices(sites, pollutants);
                    console.log('计算结果:', results);

                    // 2. 显示计算结果
                    displayResults(results, pollutants);
                } catch (error) {
                    console.error('文件处理错误:', error);
                    alert('文件解析失败: ' + error.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // 计算所有站点的水质指数
        function calculateAllSitesIndices(sites, pollutants) {
            return sites.map(site => {
                const result = {
                    name: site.name,
                    results: {} // 统一存储结果，可以是数值（指数）或字符串（错误/状态）
                };

                pollutants.forEach(pollutant => {
                    if (pollutant.toLowerCase() === '温度') return;
                    if (pollutant.toLowerCase() === '盐度') return;

                    const value = site.values[pollutant];
                    const standard = findStandard(pollutant);

                    if (standard) {
                        // 特殊处理DO：需要温度计算dof
                        if (pollutant.toLowerCase() === '溶解氧') {
                            const tempValue = parseFloat(site.values['温度']);
                            if (isNaN(tempValue)) {
                                result.results[pollutant] = '缺少温度';
                            } else {
                                const dof = 468 / (31.6 + tempValue);
                                result.results[pollutant] = calculateIndex(value, standard, dof);
                            }
                        } else {
                            result.results[pollutant] = calculateIndex(value, standard);
                        }
                    } else {
                        result.results[pollutant] = '项目错误';
                    }
                });

                return result;
            });
        }

        // 显示计算结果
        function displayResults(results, pollutants) {
            const container = document.getElementById('resultContainer');
            container.innerHTML = '';

            if (results.length === 0) {
                container.innerHTML = '<p>未找到有效数据</p>';
                return;
            }

            // 创建结果表格
            const table = document.createElement('table');

            // 表头
            const headerRow = document.createElement('tr');
            const siteHeader = document.createElement('th');
            siteHeader.textContent = '站点';
            headerRow.appendChild(siteHeader);

            // 过滤掉温度项（不在表头显示）
            const displayPollutants = pollutants.filter(p => p.toLowerCase() !== '温度' && p.toLowerCase() !== '盐度');

            displayPollutants.forEach(pollutant => {
                const th = document.createElement('th');
                th.textContent = pollutant;
                headerRow.appendChild(th);
            });

            table.appendChild(headerRow);

            // 数据行
            results.forEach(result => {
                const row = document.createElement('tr');
                row.classList.add('result-row');

                const siteCell = document.createElement('td');
                siteCell.textContent = result.name;
                row.appendChild(siteCell);

                displayPollutants.forEach(pollutant => {
                    const td = document.createElement('td');
                    const val = result.results[pollutant];

                    if (typeof val === 'number') {
                        td.textContent = val.toFixed(3);
                    } else {
                        td.textContent = val || '';
                        const errorStrings = ['非法', '项目错误', '缺少温度', '未知类型'];

                        const isError = val != null && errorStrings.some(keyword =>
                            String(val).includes(keyword)
                        );
                        if (isError) {
                            td.classList.add('error');
                        }
                    }

                    row.appendChild(td);
                });

                table.appendChild(row);
            });

            container.appendChild(table);

            // 显示下载按钮
            const exportBtn = document.getElementById('export-excel');
            if (exportBtn) {
                exportBtn.style.display = 'block';
            }
        }

        // 根据污染物名称查找标准
        function findStandard(pollutantName) {
            // 遍历所有标准项
            for (const key in seawaterQualityStandards.items) {
                const item = seawaterQualityStandards.items[key];

                // 检查标准项的名称或别名是否匹配
                if (item.names.some(name =>
                    name.toLowerCase() === pollutantName.toLowerCase())) {
                    return item;
                }
            }

            return null;
        }

    </script>
</body>

</html>

<button id="export-excel" style="display: none;">下载评价结果 (Excel)</button>
<script>
    document.getElementById('export-excel').addEventListener('click', function () {
        // 获取评价结果表格
        const table = document.querySelector('table'); // 请替换为实际表格选择器

        // 创建工作簿和工作表
        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.table_to_sheet(table);

        // 添加工作表到工作簿
        XLSX.utils.book_append_sheet(wb, ws, "评价结果");

        // 生成Excel文件并下载
        XLSX.writeFile(wb, "海水水质评价结果.xlsx");
    });
</script>
