<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>环境质量等级指数 (聚合增强版)</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        table {
            border-collapse: collapse;
            margin: 20px 0;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }

        .result-row {
            background-color: #e6f7ff;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>
    <h1>环境质量等级指数 (聚合增强版)：海水水质标准（GB 3097-1997）</h1>

    <button onclick="downloadSample()">下载示例数据</button>
    <input type="file" id="fileInput" accept=".xlsx, .xls, .csv" onchange="processFile()" />

    <div id="resultContainer"></div>
    <button id="export-excel" style="display: none;">下载评价结果 (Excel)</button>
    <!-- // 引入海水水质标准 -->
    <script src="seawaterQualityStandards.js"></script>

    <script>
        function downloadSample() {
            const link = document.createElement('a');
            link.href = '测试数据.csv';
            link.download = '测试数据.csv';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // 数据清洗与转数字
        function parseVal(val) {
            if (val === undefined || val === null) return undefined;
            const s = String(val).replace(/\s+/g, '').toUpperCase();
            if (s === '' || s === '/') return undefined;
            if (s === '未检出' || s === 'ND') return 0;
            const numStr = s.endsWith('L') ? s.slice(0, -1) : s;
            if (!/^\d*\.?\d+$/.test(numStr)) return `非法(${val})`;
            const n = parseFloat(numStr);
            return n >= 0 ? n : `非法(${val})`;
        }


        // 水质指数计算函数（增加dof参数）
        function calculateIndex(value, standard, dof) {
            const { type, values } = standard;

            // 处理未定义和空值（数据缺失）
            if (value === undefined) {
                return '';
            }
            // 处理非数字值（数据错误）
            if (value && String(value).includes('非法')) {
                return value;
            }

            switch (type) {
                case '≤':  // 污染物浓度越高水质越差
                    if (value <= values[0]) {
                        return value / values[0]; // 0~1类之间
                    } else if (value <= values[1]) {
                        return 1 + (value - values[0]) / (values[1] - values[0]); // 1~2类
                    } else if (value <= values[2]) {
                        return 2 + (value - values[1]) / (values[2] - values[1]); // 2~3类
                    } else if (values[3] === null) {
                        // 4类标准为null时，超出3类，超标倍数法。特例,针对:'大肠菌群'和'粪大肠杆菌群'
                        return 3 + (value - values[2]) / values[2];
                    } else {
                        // 4类标准不为null时
                        if (value <= values[3]) {
                            return 3 + (value - values[2]) / (values[3] - values[2]); // 3~4类
                        } else {
                            return 4 + (value - values[3]) / values[3]; // 超出4类，超标倍数法
                        }
                    }

                case '>':  // 污染物浓度越高水质越好（溶解氧）
                    // 使用传入的dof值（饱和溶解氧）
                    if (value >= dof) return 0; // 0类
                    else if (value >= values[0]) return (dof - value) / (dof - values[0]); // 0~1类
                    else if (value >= values[1]) return 1 + (values[0] - value) / (values[0] - values[1]); // 1~2类
                    else if (value >= values[2]) return 2 + (values[1] - value) / (values[1] - values[2]); // 2~3类
                    else if (value >= values[3]) return 3 + (values[2] - value) / (values[2] - values[3]); // 3~4类
                    else return 4 + (values[3] - value) / values[3]; // 超出4类

                case '<>':  // 有最佳范围（pH）
                    const class1Range = values[0]; // [7.8, 8.5]
                    const class3Range = values[2]; // [6.8, 8.8]
                    const pH0 = (class1Range[0] + class1Range[1]) / 2; // 最佳值（1类范围的中点）

                    if (value >= class1Range[0] && value <= class1Range[1]) {
                        return Math.abs(value - pH0) / (class1Range[1] - pH0); // 1类范围内
                    }
                    else if (value >= class3Range[0] && value < class1Range[0]) {
                        return 2 + (class1Range[0] - value) / (class1Range[0] - class3Range[0]); // 左侧3类范围
                    }
                    else if (value > class1Range[1] && value <= class3Range[1]) {
                        return 2 + (value - class1Range[1]) / (class3Range[1] - class1Range[1]); // 右侧3类范围
                    }
                    else if (value < class3Range[0]) {
                        return 4 + (class3Range[0] - value) / 1; // 低于3类下限
                    }
                    else if (value > class3Range[1]) {
                        return 4 + (value - class3Range[1]) / 0.3; // 高于3类上限
                    }
                    return 0;

                default:
                    return '未知类型';
            }
        }

        // 处理上传的Excel文件
        function processFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            if (!file) {
                alert('请选择Excel文件');
                return;
            }

            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];

                    // 将Excel数据转换为JSON
                    const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                    // 解析Excel结构
                    const pollutants = jsonData[0].slice(1); // 污染物名称（第一行）
                    const csvUnits = jsonData[1] ? jsonData[1].slice(1) : []; // 单位（第二行）
                    const sites = [];

                    // 从第三行开始处理站点数据
                    for (let i = 2; i < jsonData.length; i++) {
                        const row = jsonData[i];
                        if (!row || row.length === 0) continue;

                        const site = {
                            name: row[0],
                            values: {}
                        };

                        // 处理每个污染物值
                        for (let j = 1; j < row.length; j++) {
                            const pollutantName = pollutants[j - 1];
                            const csvUnit = csvUnits[j - 1] ? String(csvUnits[j - 1]).trim() : null;
                            var processedValue = parseVal(row[j]);

                            // 基于单位进行数字转换
                            if (typeof processedValue === 'number') {
                                const standardResult = findStandard(pollutantName);
                                if (standardResult && standardResult.item.unit && csvUnit) {
                                    const standardItem = standardResult.item;
                                    const standardUnit = standardItem.unit.trim();
                                    if (csvUnit !== standardUnit) {
                                        if (csvUnit === 'μg/L' && standardUnit === 'mg/L') {
                                            processedValue = processedValue / 1000;
                                        } else if (csvUnit === 'mg/L' && standardUnit === 'μg/L') {
                                            processedValue = processedValue * 1000;
                                        }
                                        // 可以根据需要添加更多转换逻辑
                                    }
                                }
                            }

                            site.values[pollutantName] = processedValue;
                        }

                        sites.push(site);
                    }
                    console.log('项目列表:', pollutants);
                    console.log('清洗数据:', sites);


                    // 1. 计算所有站点的水质指数
                    const results = calculateAllSitesIndices(sites, pollutants);
                    console.log('计算结果:', results);

                    // 1.5 聚合结果
                    const aggregatedResults = aggregateResults(results);
                    console.log('聚合结果:', aggregatedResults);

                    // 2. 显示计算结果
                    displayResults(aggregatedResults, pollutants);
                } catch (error) {
                    console.error('文件处理错误:', error);
                    alert('文件解析失败: ' + error.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // 聚合各站点的指数结果（最大值、平均值、中位值）
        function aggregateResults(results) {
            results.forEach(siteResult => {
                const validValues = Object.values(siteResult.results)
                    .filter(val => typeof val === 'number');

                if (validValues.length > 0) {
                    // 最大值
                    siteResult.maxIndex = Math.max(...validValues);

                    // 平均值
                    const sum = validValues.reduce((a, b) => a + b, 0);
                    siteResult.meanIndex = sum / validValues.length;

                    // 中位值
                    const sorted = [...validValues].sort((a, b) => a - b);
                    const mid = Math.floor(sorted.length / 2);
                    siteResult.medianIndex = sorted.length % 2 !== 0
                        ? sorted[mid]
                        : (sorted[mid - 1] + sorted[mid]) / 2;
                } else {
                    siteResult.maxIndex = '-';
                    siteResult.meanIndex = '-';
                    siteResult.medianIndex = '-';
                }
            });
            return results;
        }

        // 计算所有站点的水质指数
        function calculateAllSitesIndices(sites, pollutants) {
            return sites.map(site => {
                const result = {
                    name: site.name,
                    results: {} // 统一存储结果，可以是数值（指数）或字符串（错误/状态）
                };

                // 预先查找温度值，以备DO计算使用
                let temperatureValue = NaN;
                for (const pName of pollutants) {
                    const std = findStandard(pName);
                    if (std && std.key === '温度') {
                        temperatureValue = parseFloat(site.values[pName]);
                        break;
                    }
                }

                pollutants.forEach(pollutant => {
                    const standardResult = findStandard(pollutant);
                    if (!standardResult) {
                        result.results[pollutant] = '未找到标准';
                        return;
                    }

                    const { item: standard, key } = standardResult;

                    // 跳过不计算指数的项目（如温度、盐度）
                    if (standard.type === 'none') return;

                    const value = site.values[pollutant];

                    // 特殊处理溶解氧：需要温度计算dof
                    if (key === '溶解氧') {
                        if (isNaN(temperatureValue)) {
                            result.results[pollutant] = '缺少温度';
                        } else {
                            const dof = 468 / (31.6 + temperatureValue);
                            result.results[pollutant] = calculateIndex(value, standard, dof);
                        }
                    } else {
                        result.results[pollutant] = calculateIndex(value, standard);
                    }
                });

                return result;
            });
        }

        // 显示计算结果
        function displayResults(results, pollutants) {
            const container = document.getElementById('resultContainer');
            container.innerHTML = '';

            if (results.length === 0) {
                container.innerHTML = '<p>未找到有效数据</p>';
                return;
            }

            // 创建结果表格
            const table = document.createElement('table');

            // 表头
            const headerRow = document.createElement('tr');
            const siteHeader = document.createElement('th');
            siteHeader.textContent = '站点';
            headerRow.appendChild(siteHeader);

            // 过滤掉不显示指数的项目（如温度、盐度）
            const displayPollutants = pollutants.filter(p => {
                const std = findStandard(p);
                if (!std) return true; // 未找到标准的项目也显示
                return std.item.type !== 'none';
            });

            displayPollutants.forEach(pollutant => {
                const th = document.createElement('th');
                th.textContent = pollutant;
                headerRow.appendChild(th);
            });

            // 添加聚合列头
            const aggregateHeaders = ['最大值', '平均值', '中位值'];
            aggregateHeaders.forEach(text => {
                const th = document.createElement('th');
                th.textContent = text;
                th.style.backgroundColor = '#d4edda'; // 稍微区分一下
                headerRow.appendChild(th);
            });

            table.appendChild(headerRow);

            // 数据行
            results.forEach(result => {
                const row = document.createElement('tr');
                row.classList.add('result-row');

                const siteCell = document.createElement('td');
                siteCell.textContent = result.name;
                row.appendChild(siteCell);

                displayPollutants.forEach(pollutant => {
                    const td = document.createElement('td');
                    const val = result.results[pollutant];

                    if (typeof val === 'number') {
                        td.textContent = val.toFixed(3);
                    } else {
                        td.textContent = val || '';
                        const errorStrings = ['非法', '未找到标准', '缺少温度', '未知类型'];

                        const isError = val != null && errorStrings.some(keyword =>
                            String(val).includes(keyword)
                        );
                        if (isError) {
                            td.classList.add('error');
                        }
                    }

                    row.appendChild(td);
                });

                // 添加聚合数据列
                const aggValues = [result.maxIndex, result.meanIndex, result.medianIndex];
                aggValues.forEach(val => {
                    const td = document.createElement('td');
                    if (typeof val === 'number') {
                        td.textContent = val.toFixed(3);
                        td.style.fontWeight = 'bold';
                    } else {
                        td.textContent = val || '';
                    }
                    row.appendChild(td);
                });

                table.appendChild(row);
            });

            container.appendChild(table);

            // 显示下载按钮
            const exportBtn = document.getElementById('export-excel');
            if (exportBtn) {
                exportBtn.style.display = 'block';
            }
        }

        // 根据污染物名称查找标准，返回 { item, key }
        function findStandard(pollutantName) {
            // 遍历所有标准项
            for (const key in seawaterQualityStandards.items) {
                const item = seawaterQualityStandards.items[key];

                // 检查标准项的名称或别名是否匹配
                if (item.names.some(name =>
                    name.toLowerCase() === pollutantName.trim().toLowerCase())) {
                    return { item, key };
                }
            }

            return null;
        }

        document.getElementById('export-excel').onclick = () => {
            const wb = XLSX.utils.book_new(), ws = XLSX.utils.table_to_sheet(document.querySelector('table'));
            XLSX.utils.book_append_sheet(wb, ws, "评价结果");
            XLSX.writeFile(wb, "海水水质评价结果.xlsx");
        };

    </script>
</body>

</html>
